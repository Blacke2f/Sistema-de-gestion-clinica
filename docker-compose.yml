version: '3.8'

services:
  app:
    image: serversideup/php:8.3-fpm-alpine
    container_name: sisgeclin-app
    restart: unless-stopped
    working_dir: /app
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=sisgeclin_laravel
      - DB_USERNAME=sisgeclin_user
      - DB_PASSWORD=sisgeclin_password
      - APP_DEBUG=false
      - APP_ENV=production
      - QUEUE_CONNECTION=database
      - PHP_INI_DISPLAY_ERRORS=off
      - PHP_OPcache_ENABLE=1
    volumes:
      - .:/app
      - ./storage:/app/storage
    ports:
      - "192.168.1.2:9000:9000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sisgeclin-network

  db:
    image: mysql:8.0
    container_name: sisgeclin-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: sisgeclin_laravel
      MYSQL_USER: sisgeclin_user
      MYSQL_PASSWORD: sisgeclin_password
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "192.168.1.2:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sisgeclin-network

  nginx:
    image: nginx:alpine
    container_name: sisgeclin-nginx
    restart: unless-stopped
    ports:
      - "192.168.1.2:80:80"
      - "192.168.1.2:443:443"
    volumes:
      - .:/app
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - sisgeclin-network

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: sisgeclin-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - sisgeclin-network

volumes:
  db_data:
    driver: local

networks:
  sisgeclin-network:
    driver: bridge
